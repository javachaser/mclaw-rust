[package]
name = "mclaw"
version = "1.0.2"
edition = "2021"
description = "MClaw - OpenClaw Local Manager"

[[bin]]
name = "mclaw"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# HTTP server
axum = "0.7"
# HTTP client (for healthz check)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Embedded desktop window
winit = "0.30"
wry = "0.55"
image = { version = "0.25", default-features = false, features = ["png"] }
# Tower (axum dependency for CORS etc.)
tower-http = { version = "0.5", features = ["cors"] }

# For process management
# (uses std::process)


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
